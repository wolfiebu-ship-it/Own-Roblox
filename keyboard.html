<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keyboard Escape</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
:root{--ink:#1d2a44;--paper:#fffdf6;--accent:#ff6b3d;--go:#2bb673;--gold:#ffc83d;--muted:#5a6a88;--display:'Lilita One','Arial Black',Impact,sans-serif;--body:'Nunito',system-ui,sans-serif}
html,body{height:100%;margin:0;overflow:hidden;background:#151a33;color:var(--ink);font-family:var(--body);font-weight:600}
canvas{display:block;touch-action:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink)}
.btn{border:3px solid var(--ink);border-radius:10px;background:var(--paper);padding:8px 14px;font-weight:800;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.primary{background:var(--accent);color:var(--paper)}
#menu,#win{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));box-sizing:border-box;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:center}
h1,h2{font-family:var(--display);font-weight:400;margin:0;color:var(--accent);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
h1{font-size:46px;line-height:1}
h2{font-size:38px;color:var(--gold)}
p{margin:0;color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a.btn{text-decoration:none;color:var(--ink)}
#win dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0;text-align:left}
#win dt{color:var(--muted)}#win dd{margin:0;font-weight:800}
#hud{position:fixed;inset:0;pointer-events:none}#hud>*{pointer-events:auto}
#stats{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:14px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 190px)}
.pill{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:800;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.pill b{font-family:var(--display);font-weight:400;font-size:18px}
#top{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:14px;display:flex;gap:8px}
#top .btn{padding:4px 10px;font-size:14px}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);font-family:var(--display);font-size:38px;color:var(--paper);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#stick{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:max(50px,calc(env(safe-area-inset-bottom,0px) + 40px));width:120px;height:120px;border-radius:50%;background:rgba(255,253,246,.3);border:3px solid rgba(255,253,246,.6);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}
#jumpBtn{position:absolute;right:max(24px,env(safe-area-inset-right,0px));bottom:max(60px,calc(env(safe-area-inset-bottom,0px) + 50px));width:84px;height:84px;border-radius:50%;font-family:var(--display);font-size:18px;touch-action:none}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="menu" class="panel">
<h1>Keyboard Escape</h1>
<p>Spring über riesige Tastaturen, vom Esc bis zur Enter-Taste. Manche Tasten brechen weg, andere rutschen.</p>
<p id="who"></p>
<div class="row"><button class="btn primary" id="play">Spielen</button><button class="btn" id="prof"></button></div>
<p>WASD laufen · Leertaste springen · Maus ziehen dreht die Kamera · Esc Menü</p>
<div class="row"><a class="btn" href="index.html">Zurück zu Klotzwelt</a></div>
</div>
<div id="hud" hidden>
<div id="stats"></div>
<div id="top"><button class="btn" id="prof2"></button><button class="btn" id="menuBtn">Menü</button></div>
<div id="stick" hidden><div id="knob"></div></div>
<button class="btn primary" id="jumpBtn" hidden>Sprung</button>
</div>
<div id="toast"></div>
<div id="win" class="panel" hidden>
<h2>Entkommen!</h2>
<dl><dt>Zeit</dt><dd id="wT"></dd><dt>Stürze</dt><dd id="wD"></dd><dt>Bestzeit</dt><dd id="wB"></dd></dl>
<div class="row"><button class="btn primary" id="again">Nochmal</button><button class="btn" id="wMenu">Menü</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),V3=THREE.Vector3;
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const isTouch=matchMedia('(pointer: coarse)').matches;

// ---------- Szene ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x151a33);scene.fog=new THREE.Fog(0x151a33,60,200);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const hemi=new THREE.HemisphereLight(0xffffff,0x40305a,.8);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40,near:1,far:150});sun.shadow.bias=-.0006;scene.add(sun,sun.target);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// ---------- Tastatur-Sounds ----------
let actx,master,noise,soundProfile=store.get('ke-profil',0);
const PROFILES=['Thocky','Clacky','Creamy'];
function ac(){if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.gain.value=.9;
const c=actx.createDynamicsCompressor();master.connect(c).connect(actx.destination);
const n=actx.sampleRate*.3|0;noise=actx.createBuffer(1,n,actx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}
if(actx.state==='suspended')actx.resume();return actx}
function tone(type,f0,f1,dur,vol,t){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(master);o.start(t);o.stop(t+dur+.02)}
function hiss(ft,f,q,dur,vol,t){const s=actx.createBufferSource();s.buffer=noise;const fl=actx.createBiquadFilter();fl.type=ft;fl.frequency.value=f;fl.Q.value=q;
const g=actx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl).connect(g).connect(master);s.start(t,Math.random()*.1);s.stop(t+dur+.02)}
// p = Tonhöhe (große Tasten tiefer), up = Loslassen (leiser, heller), vol = Lautstärke
function key(p=1,up=false,vol=1){try{ac();const t=actx.currentTime,v=vol*(up?.45:1),u=up?1.4:1;
if(soundProfile===0){tone('sine',200*p*u,80*p,.11,.5*v,t);hiss('lowpass',up?1400:800,.7,.06,.35*v,t);hiss('highpass',3500,.5,.012,.08*v,t)}
else if(soundProfile===1){hiss('bandpass',3200*p,1.8,.05,.55*v,t);tone('triangle',1900*p,900*p,.035,.12*v,t);tone('sine',150*p,110*p,.05,.2*v,t+.004)}
else{tone('sine',320*p*u,130*p,.16,.45*v,t);tone('sine',480*p,200*p,.09,.15*v,t+.012);hiss('lowpass',600,.5,.09,.28*v,t)}}catch(e){}}
const labelProf=()=>{$('prof').textContent=$('prof2').textContent='Sound: '+PROFILES[soundProfile]};
function cycleProf(){soundProfile=(soundProfile+1)%3;store.set('ke-profil',soundProfile);labelProf();key(1)}
$('prof').onclick=$('prof2').onclick=cycleProf;labelProf();

// ---------- Tasten ----------
let solids=[],world;
const COL={rose:'#ff8fb1',mint:'#7fe0c3',blue:'#6fa8ff',gold:'#ffc83d',violet:'#9a7bff',peach:'#ffa96b',cream:'#ece2cc',grey:'#4a5070'};
const CYC=[COL.cream,COL.rose,COL.mint,COL.blue,COL.peach,COL.violet];
function capTex(label,col){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
g.fillStyle=col;g.fillRect(0,0,128,128);g.fillStyle='rgba(255,255,255,.28)';g.fillRect(10,10,108,108);
g.fillStyle='rgba(0,0,0,.12)';g.fillRect(10,108,108,10);g.fillStyle='#1d2a44';g.font='800 '+(label.length>2?32:52)+'px Nunito,system-ui,sans-serif';
g.textAlign='center';g.textBaseline='middle';g.fillText(label,64,60);return new THREE.CanvasTexture(c)}
const baseMat=new THREE.MeshLambertMaterial({color:0x2a2e45});
function addKey(x,top,z,w,d,label,col,o={}){
const h=1,side=new THREE.MeshLambertMaterial({color:col}),topM=new THREE.MeshLambertMaterial({map:capTex(label,col)});
const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[side,side,topM,side,side,side]);
mesh.position.set(x,top-h/2,z);mesh.castShadow=mesh.receiveShadow=true;world.add(mesh);
const stem=new THREE.Mesh(new THREE.BoxGeometry(w*.7,1.6,d*.7),baseMat);stem.position.set(x,top-h-.7,z);world.add(stem);
const s={mesh,w,h,d,box:new THREE.Box3(),x0:x,y0:top-h/2,press:0,kind:o.kind||'solid',amp:o.amp||0,sp:o.sp||1,ph:o.ph||0,cp:o.cp,goal:o.goal,state:0,t:0,vy:0,off:false,p:Math.max(.55,Math.min(1.3,1.25/Math.sqrt(w*d/5)))*(.95+Math.random()*.1),top};
upd(s);solids.push(s);return s}
function upd(s){const p=s.mesh.position;s.box.min.set(p.x-s.w/2,p.y-s.h/2,p.z-s.d/2);s.box.max.set(p.x+s.w/2,p.y+s.h/2,p.z+s.d/2)}
function buildLevel(){
if(world)scene.remove(world);world=new THREE.Group();scene.add(world);solids=[];
let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
for(let i=0;i<60;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(2+rnd()*3,1,2+rnd()*3),new THREE.MeshLambertMaterial({color:CYC[i%6]}));
m.position.set((rnd()-.5)*160,-20-rnd()*30,-rnd()*190+20);m.rotation.set(rnd()*3,rnd()*3,rnd()*3);world.add(m)}
addKey(0,0,0,5,5,'Esc',COL.rose,{cp:0});
for(let i=0;i<8;i++)addKey(i%2?1.8:-1.8,i*.5,-7-i*3.6,2.4,2.4,'F'+(i+1),CYC[i%6]);
addKey(0,3.5,-38,7,4,'Tab',COL.mint,{cp:1});
const fx=[-2.4,2.4,-2.4,2.4,0,-2.4,2.4,0];
'QWERTYUI'.split('').forEach((l,i)=>addKey(fx[i],3.5,-44.5-i*3.4,2.4,2.4,l,CYC[i%6],{kind:'fall'}));
addKey(0,3.5,-74.5,7,4,'Caps',COL.violet,{cp:2});
'ASDF'.split('').forEach((l,i)=>addKey(0,3.5,-82.5-i*4.2,3,2.4,l,CYC[(i+2)%6],{kind:'slide',amp:3.5,sp:1.2+i*.15,ph:i*1.7}));
addKey(0,3.5,-102,7,4,'Shift',COL.blue,{cp:3});
'ZXCVBNM'.split('').forEach((l,i)=>addKey(i%2?2:-2,3.5+(i+1)*.7,-109-i*3.8,2.4,2.4,l,CYC[i%6],{kind:i%2?'fall':'solid'}));
addKey(0,9.1,-142,10,3,'Space',COL.cream,{cp:4});
addKey(0,9.1,-150,4,6,'Enter',COL.gold,{goal:1});
}

// ---------- Figur ----------
const look=Object.assign({name:'Klotzi',shirt:0,pants:0,skin:0},store.get('klotzwelt-figur',{}));
const SKINS=[0xffd9b0,0xf2c08f,0xd49a6a,0xa86b42,0x6e4426,0xffe066],SHIRTS=[0x3b7de0,0xe2453c,0x3fb55e,0xff8a2b,0x8b5cd6,0xf4f4f0,0x2a2d34,0xff6fae],PANTS=[0x2a3b66,0x2a2d34,0x6b4a2b,0x3fb55e,0x8a8f99,0xe2453c];
$('who').textContent='Du spielst als '+(look.name||'Klotzi')+' (Figur aus Klotzwelt).';
function makeAvatar(){const g=new THREE.Group(),m=c=>new THREE.MeshLambertMaterial({color:c});
const skin=m(SKINS[look.skin]||SKINS[0]),shirt=m(SHIRTS[look.shirt]||SHIRTS[0]),pants=m(PANTS[look.pants]||PANTS[0]),dark=m(0x1d2a44);
const box=(w,h,d,mt)=>{const e=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mt);e.castShadow=true;return e};
const torso=box(.8,.8,.42,shirt);torso.position.y=1.2;g.add(torso);
const head=box(.52,.52,.52,skin);head.position.y=1.87;g.add(head);
for(const x of[-.11,.11]){const e=box(.08,.11,.02,dark);e.position.set(x,1.92,.27);g.add(e)}
const limb=(x,y,parts)=>{const pv=new THREE.Group();pv.position.set(x,y,0);let off=0;for(const[w,h,d,mt]of parts){const e=box(w,h,d,mt);e.position.y=-off-h/2;off+=h;pv.add(e)}g.add(pv);return pv};
g.userData={legL:limb(-.2,.8,[[.38,.8,.4,pants]]),legR:limb(.2,.8,[[.38,.8,.4,pants]]),armL:limb(-.56,1.58,[[.3,.34,.42,shirt],[.28,.44,.38,skin]]),armR:limb(.56,1.58,[[.3,.34,.42,shirt],[.28,.44,.38,skin]])};
return g}
const avatar=makeAvatar();scene.add(avatar);

// ---------- Physik ----------
const R=.4,H=2.1,SPEED=9,JUMP=14,GRAV=40,EPS=1e-6;
const P={pos:new V3(),vel:new V3(),onGround:false,ground:null,facing:Math.PI,coyote:0,jumpBuf:0,walk:0,spawn:new V3()};
const pb=new THREE.Box3();
function playerBox(){pb.min.set(P.pos.x-R,P.pos.y,P.pos.z-R);pb.max.set(P.pos.x+R,P.pos.y+H,P.pos.z+R);return pb}
const ov=(a,b)=>a.min.x<b.max.x-EPS&&a.max.x>b.min.x+EPS&&a.min.y<b.max.y-EPS&&a.max.y>b.min.y+EPS&&a.min.z<b.max.z-EPS&&a.max.z>b.min.z+EPS;
function moveAxis(ax,amt){if(!amt)return;P.pos[ax]+=amt;
for(const s of solids){if(s.off)continue;if(!ov(playerBox(),s.box))continue;
if(ax==='y'){if(amt<0){P.pos.y=s.box.max.y;P.onGround=true;P.ground=s}else P.pos.y=s.box.min.y-H;P.vel.y=0}
else P.pos[ax]=amt>0?s.box.min[ax]-R-1e-4:s.box.max[ax]+R+1e-4}}
const cam={yaw:0,pitch:.38,dist:11},camT=new V3();
function respawn(silent){P.pos.copy(P.spawn);P.vel.set(0,0,0);P.facing=Math.PI;P.ground=null;lastG=null;cam.yaw=0;camT.copy(P.pos).add(new V3(0,1.6,0));
for(const s of solids)if(s.kind==='fall'){s.state=0;s.off=false;s.vy=0;s.mesh.position.set(s.x0,s.y0,s.mesh.position.z);upd(s)}
if(!silent){key(.5,false,1.2);setTimeout(()=>key(.4,true),90);toast('Falsche Taste!');G.deaths++}}
function setSpawn(x,y,z){P.spawn.set(x,y,z);respawn(true)}

// ---------- Eingabe ----------
const keys={},joy={x:0,y:0};let jumpReq=false;
addEventListener('keydown',e=>{if(e.code==='Escape'){if(mode==='play')showMenu();return}
if(mode!=='play')return;keys[e.code]=true;if(e.code==='Space'){jumpReq=true;e.preventDefault()}if(e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
const cv=renderer.domElement,drags=new Map();
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drags.set(e.pointerId,{x:e.clientX,y:e.clientY})});
cv.addEventListener('pointermove',e=>{const d=drags.get(e.pointerId);if(!d)return;cam.yaw-=(e.clientX-d.x)*.006;cam.pitch=Math.max(-.15,Math.min(1.35,cam.pitch+(e.clientY-d.y)*.005));d.x=e.clientX;d.y=e.clientY});
const endD=e=>drags.delete(e.pointerId);cv.addEventListener('pointerup',endD);cv.addEventListener('pointercancel',endD);
cv.addEventListener('wheel',e=>{e.preventDefault();cam.dist=Math.max(4,Math.min(30,cam.dist*(1+Math.sign(e.deltaY)*.1)))},{passive:false});
const stick=$('stick'),knob=$('knob');let sId=null;
function mvStick(e){const r=stick.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const l=Math.hypot(dx,dy);if(l>45){dx*=45/l;dy*=45/l}joy.x=dx/45;joy.y=dy/45;knob.style.transform=`translate(${dx}px,${dy}px)`}
stick.addEventListener('pointerdown',e=>{sId=e.pointerId;stick.setPointerCapture(e.pointerId);mvStick(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===sId)mvStick(e)});
const endS=e=>{if(e.pointerId!==sId)return;sId=null;joy.x=joy.y=0;knob.style.transform=''};stick.addEventListener('pointerup',endS);stick.addEventListener('pointercancel',endS);
$('jumpBtn').addEventListener('pointerdown',e=>{e.preventDefault();jumpReq=true});

// ---------- Spielablauf ----------
const G={time:0,deaths:0,stage:0,running:false};let mode='menu',tT=0,tAll=0,lastG=null;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')+'.'+Math.floor(s%1*10);
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('show'),1000)}
function stats(){$('stats').innerHTML=`<span class="pill">Zeit <b>${fmt(G.time)}</b></span><span class="pill">Stürze <b>${G.deaths}</b></span><span class="pill">Reihe <b>${G.stage+1}/5</b></span>`}
function showMenu(){mode='menu';$('menu').hidden=false;$('hud').hidden=true;$('win').hidden=true;buildLevel();P.pos.set(0,0,0);P.spawn.set(0,0,0);P.facing=.4;camT.set(0,1.4,0)}
function start(){ac();mode='play';$('menu').hidden=true;$('hud').hidden=false;$('win').hidden=true;$('stick').hidden=$('jumpBtn').hidden=!isTouch;
buildLevel();Object.assign(G,{time:0,deaths:0,stage:0,running:false});setSpawn(0,0,0);cam.pitch=.38;cam.dist=11;toast('Los geht’s!');stats()}
function win(){mode='win';G.running=false;[1,1.19,1.5,2].forEach((p,i)=>setTimeout(()=>key(p*.8,false,.9),i*110));
const b=store.get('ke-best',null),nb=!b||G.time<b;if(nb)store.set('ke-best',G.time);
$('wT').textContent=fmt(G.time);$('wD').textContent=G.deaths;$('wB').textContent=nb?fmt(G.time)+' (neu!)':fmt(b);setTimeout(()=>{if(mode==='win')$('win').hidden=false},800)}
$('play').onclick=start;$('again').onclick=start;$('menuBtn').onclick=showMenu;$('wMenu').onclick=showMenu;

function updKeys(dt){
for(const s of solids){
const stand=P.ground===s&&P.onGround&&!s.off;
s.press+=((stand?1:0)-s.press)*Math.min(1,dt*(stand?30:12));
let x=s.x0,y=s.y0-s.press*.22,oy=s.mesh.position.y,ox=s.mesh.position.x;
if(s.kind==='slide')x=s.x0+Math.sin(tAll*s.sp+s.ph)*s.amp;
if(s.kind==='fall'){
if(s.state===0&&stand){s.state=1;s.t=.7;key(1.3,true,.5)}
if(s.state===1){s.t-=dt;x=s.x0+(Math.random()-.5)*.12;if(Math.random()<dt*14)key(1.2+Math.random()*.4,true,.25);if(s.t<=0){s.state=2;s.off=true;s.vy=0;s.t=0}}
if(s.state===2){s.t+=dt;s.vy+=30*dt;oy=s.mesh.position.y;y=oy-s.vy*dt;x=s.x0;if(s.t>3){s.state=0;s.off=false;s.vy=0;s.press=0;y=s.y0}}}
if(s.state===2&&s.t<=3){s.mesh.position.set(x,y,s.mesh.position.z)}
else{s.mesh.position.set(x,y,s.mesh.position.z)}
upd(s);
if(stand&&s.state!==2){P.pos.x+=x-ox;P.pos.y+=y-oy}}}
function updPlayer(dt){
let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y,r=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;
if(keys.KeyQ)cam.yaw+=dt*2.2;if(keys.KeyE)cam.yaw-=dt*2.2;
const fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw),rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw);
let mx=fx*f+rx*r,mz=fz*f+rz*r;const ml=Math.hypot(mx,mz);if(ml>1){mx/=ml;mz/=ml}
const ac_=P.onGround?18:7;P.vel.x+=(mx*SPEED-P.vel.x)*Math.min(1,ac_*dt);P.vel.z+=(mz*SPEED-P.vel.z)*Math.min(1,ac_*dt);
if(ml>.1){let d=Math.atan2(mx,mz)-P.facing;d=Math.atan2(Math.sin(d),Math.cos(d));P.facing+=d*Math.min(1,14*dt);G.running=true}
if(jumpReq){P.jumpBuf=.15;jumpReq=false}P.jumpBuf-=dt;P.coyote=P.onGround?.1:P.coyote-dt;
if(P.jumpBuf>0&&P.coyote>0){P.vel.y=JUMP;P.jumpBuf=0;P.coyote=0;G.running=true}
P.vel.y=Math.max(-45,P.vel.y-GRAV*dt);
for(let i=0;i<2;i++){moveAxis('x',P.vel.x*dt/2);moveAxis('z',P.vel.z*dt/2);P.onGround=false;moveAxis('y',P.vel.y*dt/2);if(!P.onGround)P.ground=null}
if(P.pos.y<-14)respawn();
const g=P.onGround?P.ground:null;
if(g!==lastG){if(lastG&&!g)key(lastG.p,true,.8);
if(g){key(g.p);if(g.cp!==undefined&&g.cp>=G.stage&&P.spawn.z!==g.x0+0&&(G.stage!==g.cp||g.cp>0)&&!g.done){g.done=true;if(g.cp>0){P.spawn.set(g.mesh.position.x,g.top,g.mesh.position.z);G.stage=g.cp;toast('Checkpoint!')}}
if(g.goal){win();return}}lastG=g}
const sp=Math.hypot(P.vel.x,P.vel.z);P.walk+=sp*dt*1.4;const am=P.onGround?Math.min(1,sp/SPEED):0,sw=Math.sin(P.walk)*.8*am,u=avatar.userData;
u.legL.rotation.x=sw;u.legR.rotation.x=-sw;u.armL.rotation.x=P.onGround?-sw:-2.6;u.armR.rotation.x=P.onGround?sw:-2.6;
avatar.position.copy(P.pos);avatar.rotation.y=P.facing}

let last=performance.now(),st=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;tAll+=dt;
hemi.color.setHSL((tAll*.05)%1,.7,.65);
if(mode==='menu'){const u=avatar.userData;u.legL.rotation.x=u.legR.rotation.x=0;u.armL.rotation.x=Math.sin(tAll*2)*.15;u.armR.rotation.x=-2.4+Math.sin(tAll*6)*.4;
avatar.position.copy(P.pos);avatar.rotation.y=P.facing;cam.yaw=-.5+Math.sin(tAll*.25)*.35;cam.pitch=.28;cam.dist=8;camT.set(0,1.6-(innerWidth>600?0:-1.5),0)}
else{updKeys(dt);if(mode==='play'){updPlayer(dt);if(G.running)G.time+=dt}camT.lerp(new V3(P.pos.x,P.pos.y+1.6,P.pos.z),1-Math.exp(-dt*12))}
const cp=Math.cos(cam.pitch);camera.position.set(camT.x+Math.sin(cam.yaw)*cp*cam.dist,camT.y+Math.sin(cam.pitch)*cam.dist,camT.z+Math.cos(cam.yaw)*cp*cam.dist);camera.lookAt(camT);
sun.position.set(P.pos.x+25,P.pos.y+50,P.pos.z+18);sun.target.position.copy(P.pos);
if((st+=dt)>.1){st=0;if(mode==='play')stats()}
renderer.render(scene,camera);requestAnimationFrame(frame)}
showMenu();requestAnimationFrame(frame);
})();
